name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / MySQL test suite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bale_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, mbstring, openssl, json
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PHP syntax check (all files)
        run: |
          find app public cli tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install the app (CI bootstrap)
        run: |
          chmod +x tests/*.sh
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=bale_test DB_USER=root DB_PASS=root ./tests/ci-setup.sh

      - name: Start mock Bale + Instagram servers
        run: |
          nohup python3 tests/mock_servers.py --bale-port 9099 --ig-port 9098 --log /tmp/mock.jsonl >/tmp/mock.log 2>&1 &
          sleep 2
          curl -sf -X POST http://127.0.0.1:9099/bot123456:TESTTOKEN/getMe -H 'Content-Type: application/json' -d '{}'

      - name: Integration tests (bot logic)
        run: php tests/integration.php /tmp/mock.jsonl

      - name: Start web server
        run: |
          nohup php -S 127.0.0.1:8080 -t public >/tmp/php-server.log 2>&1 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8080/admin/?r=login

      - name: Smoke tests (panel + webhook)
        env:
          BASE: http://127.0.0.1:8080
          ADMIN_USER: admin
          ADMIN_PASS: CiTestPassword123
        run: ./tests/smoke.sh

      - name: Show server log on failure
        if: failure()
        run: |
          echo "----- php server -----"; tail -50 /tmp/php-server.log || true
          echo "----- app logs -----"; cat storage/logs/*.log 2>/dev/null | tail -80 || true
          echo "----- mock log -----"; tail -30 /tmp/mock.log || true
